# Projet Xcode généré avec XcodeGen : `brew install xcodegen && xcodegen generate`
name: RareCandy
options:
  bundleIdPrefix: com.rarecandy
  developmentLanguage: fr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  RareCandyKit:
    path: RareCandyKit

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  RareCandy:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: RareCandyKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: RareCandy
        CFBundleDevelopmentRegion: fr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        # À remplacer par un identifiant unique à toi (ex. com.tonnom.rarecandy).
        PRODUCT_BUNDLE_IDENTIFIER: com.rarecandy.app
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM: XXXXXXXXXX   # ton Team ID Apple Developer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # Pour le widget / l'Apple Watch : décommenter pour activer l'App Group
    # (le fichier de données y sera déplacé automatiquement, voir StorageLocation).
    # entitlements:
    #   path: App/RareCandy.entitlements
    #   properties:
    #     com.apple.security.application-groups:
    #       - group.com.rarecandy.app
    scheme: {}
