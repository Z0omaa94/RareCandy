name: Aperçu Expo Go

# Runs the Expo dev server on a GitHub runner, reachable from a phone through an
# Expo tunnel, so the app opens in Expo Go without a Mac. The tunnel address is
# fixed (TUNNEL_ID + Expo username), so the QR code in the README always points here.
#
# Expo Go signed in to an Expo account only opens projects whose server is signed
# in to the same account: the EXPO_TOKEN repository secret (a personal access token
# from expo.dev) signs the runner in, links the project and signs the manifests.

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/expo-go.yml'
  workflow_dispatch:
    inputs:
      minutes:
        description: "Durée de l'aperçu, en minutes (330 max)"
        default: '120'

permissions:
  contents: read

concurrency:
  group: expo-go-preview
  cancel-in-progress: true

env:
  TUNNEL_ID: rc03keukql
  MINUTES: ${{ inputs.minutes || '60' }}
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  preview:
    name: Serveur Expo Go
    runs-on: ubuntu-latest
    timeout-minutes: 345
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Compte Expo
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::warning::Pas de secret EXPO_TOKEN : serveur anonyme, Expo Go doit être déconnecté pour l'ouvrir."
            exit 0
          fi
          echo "Connecté à Expo en tant que : $(npx expo whoami)"
          # Creates the project on the account the first time, links it afterwards.
          npx --yes eas-cli@25.3.0 init --non-interactive --force
          echo "Projet EAS : $(node -p "require('./app.json').expo.extra.eas.projectId")"

      - name: Démarrer le serveur et le tunnel
        run: |
          mkdir -p .expo
          echo "{\"urlRandomness\":\"$TUNNEL_ID\"}" > .expo/settings.json
          # SDK 58's default tunnel needs an Expo account; the ngrok one does not.
          nohup npx expo start --tunnel ngrok --port 8081 > expo.log 2>&1 &
          PID=$!
          for i in $(seq 1 90); do
            grep -q "Tunnel ready" expo.log && break
            kill -0 "$PID" 2> /dev/null || break
            sleep 2
          done
          cat expo.log
          grep -q "Tunnel ready" expo.log

      - name: Vérifier le tunnel et préparer le bundle iOS
        run: |
          curl -sSf -H 'expo-platform: ios' -H 'accept: application/expo+json,application/json' http://127.0.0.1:8081/ > manifest.json
          # The tunnel host the manifest points phones to: <TUNNEL_ID>-<user>-8081.exp.direct
          HOST=$(node -p "require('./manifest.json').extra.expoClient.hostUri")
          echo "HOST=$HOST" >> "$GITHUB_ENV"
          curl -sSf --retry 5 --retry-delay 3 "http://$HOST/status"; echo
          if [ -n "$EXPO_TOKEN" ]; then
            # Expo Go asks for a manifest signed by the expo-root certificate chain.
            curl -sS -D headers.txt -o /dev/null -H 'expo-platform: ios' -H 'accept: multipart/mixed,application/expo+json' \
              -H 'expo-expect-signature: sig, keyid="expo-root", alg="rsa-v1_5-sha256"' http://127.0.0.1:8081/
            grep -i "content-type" headers.txt
          fi
          BUNDLE=$(node -p "const u=new URL(require('./manifest.json').launchAsset.url);'http://127.0.0.1:8081'+u.pathname+u.search")
          curl -sSf -o /dev/null -w "Bundle iOS : %{size_download} octets en %{time_total} s\n" --max-time 600 "$BUNDLE"

      - name: QR code
        run: |
          URL="exp://$HOST"
          node scripts/expo-go-qr.mjs "$URL"
          {
            echo "## Aperçu Expo Go ouvert"
            echo
            echo "Adresse : \`$URL\`"
            echo
            echo "Scanne le QR code du README avec l'appareil photo de l'iPhone (Expo Go installé)."
            echo "Le serveur reste ouvert environ $MINUTES minutes."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Garder le serveur ouvert
        run: |
          case "$MINUTES" in ''|*[!0-9]*) MINUTES=60 ;; esac
          [ "$MINUTES" -gt 330 ] && MINUTES=330
          END=$(( $(date +%s) + MINUTES * 60 ))
          FAILS=0
          while [ "$(date +%s)" -lt "$END" ]; do
            sleep 60
            if curl -sf --max-time 20 "http://$HOST/status" > /dev/null; then
              FAILS=0
            else
              FAILS=$((FAILS + 1))
              echo "Tunnel injoignable ($FAILS)"
              if [ "$FAILS" -ge 3 ]; then
                echo "Redémarrage du serveur"
                pkill -f "expo start" || true
                sleep 5
                nohup npx expo start --tunnel ngrok --port 8081 >> expo.log 2>&1 &
                FAILS=0
                sleep 60
              fi
            fi
          done

      - name: Journal du serveur
        if: always()
        run: cat expo.log || true
