name: CI

on:
  push:
  pull_request:

jobs:
  mobile:
    name: App Expo (tests, types, lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Tests du moteur
        run: npm test
      - name: Types
        run: npm run typecheck
      - name: Lint
        run: npx eslint src
